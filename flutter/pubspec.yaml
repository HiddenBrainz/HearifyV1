name: hearify
description: "Hearify — auditory rehabilitation app (Flutter port)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management / DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Firebase (Phase 2+)
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.3
  firebase_crashlytics: ^4.0.4

  # Audio / TTS / STT (Phases 4-5)
  just_audio: ^0.9.40
  audioplayers: ^6.0.0
  audio_session: ^0.1.21
  flutter_tts: ^4.0.2
  speech_to_text: ^7.0.0
  record: ^5.1.2
  # Neural TTS — Piper voices via Sherpa-ONNX (consistent voice across
  # iOS / Android / desktop). Web falls back to flutter_tts.
  sherpa_onnx: ^1.10.30

  # Persistence
  shared_preferences: ^2.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # Permissions
  permission_handler: ^11.3.1

  # Data / serialization
  csv: ^6.0.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  http: ^1.2.0
  archive: ^3.6.1

  # UI helpers
  fl_chart: ^0.68.0
  lottie: ^3.1.2
  url_launcher: ^6.3.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Codegen
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/csv/
    - assets/audio/
    - assets/audio/CM Folder/
    - assets/audio/CP Folder/
    - assets/audio/CV Data/
    - assets/audio/FC Folder/
    - assets/audio/PD Folder/
    - assets/audio/Vowels Folder/
    - assets/audio/Syllables/
    - assets/audio/Sentences/
    - assets/audio/Word Recognition/
